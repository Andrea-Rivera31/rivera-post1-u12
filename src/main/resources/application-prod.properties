# Perfil prod: los valores reales llegan por variables de entorno
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# update y no validate: en el primer despliegue la base está vacía y validate
# haría fallar el arranque (no hay herramienta de migraciones en este laboratorio)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.universidad.catalogo=INFO

# Actuator: en producción solo health e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized