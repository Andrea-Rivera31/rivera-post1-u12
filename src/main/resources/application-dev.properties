# Perfil dev: arranca sin configurar nada (H2 en memoria)
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:devdb}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.com.universidad.catalogo=DEBUG

# Actuator: todos los endpoints visibles en desarrollo
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always